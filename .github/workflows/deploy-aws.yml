name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aegis-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write    # OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM cross-build on x86 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Compute image URI
        id: image
        run: |
          URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Build & push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}:latest
            ${{ steps.image.outputs.uri }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ steps.image.outputs.uri }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.uri }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger remote redeploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "deploy ${{ env.IMAGE_TAG }}" \
              --parameters "commands=[\
                'set -euo pipefail',\
                'cd /opt/aegis',\
                'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${IMAGE_URI%/*}',\
                '/usr/local/bin/aegis-render-env ${{ env.AWS_REGION }} ${{ secrets.AWS_SECRET_ARN }}',\
                '/usr/local/bin/aegis-prepare-pgdump-env',\
                'docker compose pull',\
                'docker compose up -d',\
                'sleep 5',\
                'curl -fsS http://127.0.0.1:8000/api/health'\
              ]" \
              --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Poll for completion
          for _ in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'Status' --output text || echo "Pending")
              echo "status=$STATUS"
              case "$STATUS" in
                Success) exit 0 ;;
                Failed|Cancelled|TimedOut) ;&
                Error)
                    aws ssm get-command-invocation \
                        --command-id "$CMD_ID" \
                        --instance-id "$INSTANCE_ID" \
                        --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                        --output text
                    exit 1 ;;
              esac
              sleep 5
          done
          echo "Deploy timed out" >&2
          exit 1

      - name: Smoke test public endpoint
        if: ${{ secrets.PUBLIC_HEALTH_URL != '' }}
        run: |
          set -e
          curl -fsS --retry 5 --retry-delay 5 "${{ secrets.PUBLIC_HEALTH_URL }}"
