services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: aegis-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-app:latest
    container_name: aegis-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: audits@aegis.local
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  aegis_pgdata:
