<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AEGIS — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #0a0a16;
      color: #e2e8f0;
      max-width: 520px;
      margin: 32px auto;
      padding: 0 16px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.lead { color: #94a3b8; font-size: 13px; margin-top: 0; }
    label { display: block; margin-top: 16px; font-size: 12px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 9px 11px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #050510;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 0;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .ok { color: #4ade80; font-size: 12px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h1>AEGIS — Settings</h1>
  <p class="lead">
    Configure the AEGIS API endpoint and your org-scoped Bearer API key.
    Mint a key in your AEGIS dashboard (Org → API keys) with the
    <code>audit:write</code> scope.
  </p>

  <label>API base URL
    <input type="url" id="apiBase" placeholder="https://aegis-autopilot.com" />
  </label>

  <label>API key
    <input type="password" id="apiKey" autocomplete="off" placeholder="aegis_ak_…" />
  </label>

  <button id="save">Save</button>
  <p class="ok" id="ok">Saved.</p>

  <script src="options.js"></script>
</body>
</html>
