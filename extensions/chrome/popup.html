<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AEGIS</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 16px;
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #0a0a16;
      color: #e2e8f0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .score-card {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 12px;
    }
    .score { font-size: 44px; font-weight: 800; line-height: 1; }
    .band { font-size: 12px; color: #cbd5e1; }
    .url { font-size: 11px; color: #64748b; word-break: break-all; margin-bottom: 12px; }
    ul.checks { list-style: none; padding: 0; margin: 0; font-size: 12px; }
    ul.checks li { padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.04); }
    ul.checks li:first-child { border-top: 0; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 0;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:disabled { opacity: 0.55; cursor: progress; }
    .secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      margin-top: 8px;
    }
    .err { color: #fca5a5; font-size: 12px; margin-top: 8px; }
    .locked {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      font-size: 11px;
      color: #94a3b8;
    }
    .locked strong { color: #f0abfc; }
    .config-cta {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
    }
    .config-cta a { color: #93c5fd; text-decoration: none; }
  </style>
</head>
<body>
  <h1>AEGIS · AEO Audit</h1>
  <div class="url" id="url">—</div>
  <div id="result" hidden>
    <div class="score-card">
      <div class="score" id="score">—</div>
      <div>
        <div class="band" id="band">—</div>
        <div class="band" id="plan" style="font-size:10px;color:#64748b;"></div>
      </div>
    </div>
    <ul class="checks" id="checks"></ul>
    <div class="locked" id="locked" hidden></div>
  </div>
  <button id="run">Audit this page</button>
  <button id="open-options" class="secondary">Settings</button>
  <p class="err" id="err" hidden></p>
  <p class="config-cta" id="cta" hidden>
    Configure your <a href="#" id="open-options-link">API key</a> first.
  </p>
  <script src="popup.js"></script>
</body>
</html>
