# Fly.io app config for AEGIS.
# Edit `app =` to your unique name, then:
#   flyctl launch --no-deploy --copy-config       (or `flyctl apps create aegis`)
#   flyctl postgres create --name aegis-pg
#   flyctl postgres attach aegis-pg               # sets DATABASE_URL secret
#   flyctl secrets set OPENAI_API_KEY=... REPORT_SIGNING_KEY=... SESSION_SIGNING_KEY=...
#   flyctl deploy

app = "aegis-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HF_HOME = "/opt/hf-cache"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

# torch + sentence-transformers + spaCy lg: needs >=1GB RAM.
# Bump to 2048 if you see OOMs under load.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
